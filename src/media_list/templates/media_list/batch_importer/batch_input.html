<script>
  // Bookmarks copied or dragged from Firefox come as text/html with an <a> per bookmark (folders add a <dl> around
  // them and a folder name without a link), while text/plain holds only the URLs. Read the links from the HTML so
  // titles survive; without HTML, fall back to plain text lines that are URLs, which have no title.
  function linksFromTransfer(data) {
    if (!data) {
      return [];
    }
    const html = data.getData('text/html');
    if (html) {
      const anchors = new DOMParser().parseFromString(html, 'text/html').querySelectorAll('a[href]');
      return Array.from(anchors)
        .map(a => ({title: a.textContent.replace(/\s+/g, ' ').trim(), url: a.getAttribute('href').trim()}))
        .filter(link => isWebUrl(link.url));
    }
    return data.getData('text/plain').split(/\r?\n/)
      .map(line => line.trim())
      .filter(isWebUrl)
      .map(url => ({title: '', url: url}));
  }

  function isWebUrl(text) {
    return /^https?:\/\/\S+$/i.test(text);
  }

  Vue.component('batch-input', {
    delimiters: ['[[', ']]'],
    template: `
      <div class="batch-input">
        <div class="batch-input-drop-zone" :class="{'batch-input-drop-zone-active': dragging}"
             @dragover.prevent="dragging = true" @dragleave="dragging = false" @drop.prevent="onDrop">
          Paste bookmarks anywhere on the page (Ctrl+V), or drop them here.
        </div>

        <div v-if="message" class="batch-input-message">[[message]]</div>

        <ul v-if="links.length" class="batch-input-links">
          <li v-for="(link, index) in links" :key="link.url">
            <button class="btn btn-sm btn-outline-danger" type="button" title="Remove" @click="links.splice(index, 1)">
              <i class="fas fa-times" aria-hidden="true"></i>
            </button>
            <span class="batch-input-link-title">[[link.title || '(no title)']]</span>
            <a :href="link.url" target="_blank" rel="noopener">[[link.url]]</a>
          </li>
        </ul>

        <div class="batch-input-actions">
          <button class="btn btn-primary" type="button" :disabled="!links.length || sending" @click="send">
            Send ([[links.length]])
          </button>
          <button class="btn btn-secondary" type="button" :disabled="!links.length || sending" @click="links = []">
            Clear
          </button>
        </div>
      </div>
    `,
    data: function () {
      return {
        links: [],
        dragging: false,
        sending: false,
        message: ''
      }
    },
    mounted: function () {
      this.onPaste = (event) => this.addLinks(linksFromTransfer(event.clipboardData));
      document.addEventListener('paste', this.onPaste);
    },
    destroyed: function () {
      document.removeEventListener('paste', this.onPaste);
    },
    methods: {
      onDrop: function (event) {
        this.dragging = false;
        this.addLinks(linksFromTransfer(event.dataTransfer));
      },
      addLinks: function (newLinks) {
        const known = new Set(this.links.map(link => link.url));
        const added = newLinks.filter(link => !known.has(link.url) && known.add(link.url));
        this.links.push(...added);
        const repeated = newLinks.length - added.length;
        if (!newLinks.length) {
          this.message = 'No links found in what was pasted or dropped.';
        } else {
          this.message = repeated ? `${repeated} link(s) were already in the list.` : '';
        }
      },
      send: function () {
        this.sending = true;
        $.ajax({
          url: '{% url 'batch' %}',
          type: 'POST',
          contentType: 'application/json; charset=utf-8',
          dataType: 'json',
          headers: {'X-CSRFToken': getCookie('csrftoken')},
          data: JSON.stringify({links: this.links.map(link => ({text: link.title, url: link.url}))}),
          success: (json) => {
            this.$emit('batchProcessed', json);
          },
          error: () => {
            this.sending = false;
            alert("Error!");
          }
        });
      }
    }
  });
</script>
